<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | LUNÉRA</title><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500&family=Montserrat:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ef;color:#151212;font-family:Montserrat,sans-serif}header{min-height:82px;padding:18px 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e4ded5}.logo{font:500 27px "Bodoni Moda",serif;letter-spacing:5px;color:#17352b;text-decoration:none}header a:last-child{font-size:10px;letter-spacing:1.3px;color:#17352b;text-decoration:none}main{width:min(980px,calc(100% - 32px));margin:54px auto}h1{font:400 42px "Bodoni Moda",serif;margin:0 0 8px}.muted{color:#716a62;font-size:12px;line-height:1.8}.account{margin:28px 0;padding:24px;background:#fffdfa;border:1px solid #e9e2d9;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}button{border:1px solid #17352b;background:#17352b;color:white;padding:13px 18px;font:500 10px Montserrat,sans-serif;letter-spacing:1px;cursor:pointer}.order{background:#fffdfa;border:1px solid #e9e2d9;padding:22px;margin:14px 0}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.order h3{font:500 22px "Cormorant Garamond",serif;margin:0}.items{font-size:12px;line-height:1.9;color:#514b45;margin:12px 0}.status{font-size:10px;letter-spacing:1px;color:#17352b;text-transform:uppercase}#orders>p{padding:14px;background:#fffdfa;border:1px solid #e9e2d9;font-size:12px;line-height:1.7}@media(max-width:600px){main{margin:32px auto}h1{font-size:34px}.account{padding:18px}.order{padding:17px}}
</style></head><body><header><a class="logo" href="index.html">LUNÉRA</a><a href="index.html">BACK TO STORE</a></header><main><h1>Your Account</h1><p class="muted">Your personal space for LUNÉRA orders and updates.</p><section class="account"><div><strong id="customerName">Welcome</strong><div id="customerEmail" class="muted"></div></div><button id="signout">SIGN OUT</button></section><h2 style="font:400 28px 'Bodoni Moda',serif">Your Orders</h2><div id="orders"><p>Loading your orders…</p></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="lunera-cloud.js"></script><script>
(async()=>{const box=document.getElementById("orders"),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));try{await LuneraCloud.ready;const u=await LuneraCloud.currentUser();if(!u){location.href="customer-auth.html?return=profile.html";return}document.getElementById("customerName").textContent=u.displayName||"Welcome";document.getElementById("customerEmail").textContent=u.email||"";const a=await LuneraCloud.getMyOrders();if(!a.length){box.innerHTML="<p>You have not placed an order yet. Your orders will appear here.</p>";return}box.innerHTML=a.map(o=>`<article class="order"><div class="top"><h3>Order ${esc(o.id||o.idKey)}</h3><span class="status">${esc(o.status||"Received")} · ${esc(o.paymentStatus||"Pending")}</span></div><div class="items">${(o.items||[]).map(i=>`${esc(i.name||"Item")} × ${Number(i.quantity||1)}${i.size?" · Size "+esc(i.size):""}`).join("<br>")}<br><strong>Total: ₹${Number(o.total||0).toLocaleString("en-IN")}</strong><br>${esc(o.date||"")}</div></article>`).join("")}catch(e){box.innerHTML="<p>"+esc(e.message||"Unable to load orders.")+"</p>"}})();document.getElementById("signout").onclick=()=>LuneraCloud.signOutCustomer();
</script></body></html>
