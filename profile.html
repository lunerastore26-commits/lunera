<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="lunera-monogram.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Account | LUNÉRA</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500&family=Montserrat:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f4ef;color:#151212;font-family:Montserrat,sans-serif}
header{min-height:82px;padding:18px 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e4ded5}
.logo{font:500 27px "Bodoni Moda",serif;letter-spacing:5px;color:#17352b;text-decoration:none}
header a:last-child{font-size:10px;letter-spacing:1.3px;color:#17352b;text-decoration:none}
main{width:min(980px,calc(100% - 32px));margin:54px auto}
h1{font:400 42px "Bodoni Moda",serif;margin:0 0 8px}
.muted{color:#716a62;font-size:12px;line-height:1.8}
.account{margin:28px 0;padding:24px;background:#fffdfa;border:1px solid #e9e2d9;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
button{border:1px solid #17352b;background:#17352b;color:white;padding:13px 18px;font:500 10px Montserrat,sans-serif;letter-spacing:1px;cursor:pointer}
.order{background:#fffdfa;border:1px solid #e9e2d9;padding:22px;margin:14px 0}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.order h3{font:500 22px "Cormorant Garamond",serif;margin:0}
.items{font-size:12px;line-height:1.9;color:#514b45;margin:12px 0}
.status{font-size:10px;letter-spacing:1px;color:#17352b;text-transform:uppercase}
.status-pill{display:inline-block;border:1px solid #d8e1da;padding:7px 10px;background:#f4f7f3}
.status-note{font-size:11px;color:#716a62;margin:0 0 14px}
#orders>p{padding:14px;background:#fffdfa;border:1px solid #e9e2d9;font-size:12px;line-height:1.7}
.order-date{color:#716a62;font-size:11px}
@media(max-width:600px){main{margin:32px auto}h1{font-size:34px}.account{padding:18px}.order{padding:17px}.logo{font-size:24px;letter-spacing:4px}}

/* Warm ivory plaque keeps the LUNÉRA identity crisp on every surface */
.logo-lockup{background:#f7f4ef!important;color:#17352b!important;padding:8px 13px!important;border-radius:2px;box-sizing:border-box}
.logo-lockup .logo-wordmark{color:#17352b!important}
.logo-lockup .logo-divider{background:#17352b!important}
.logo-lockup .logo-symbol path{stroke:#17352b!important}
.footer-brand.logo-lockup{padding:10px 15px!important}
@media(max-width:850px){.logo-lockup{padding:6px 10px!important}}
</style>

<style id="lunera-refined-logo">
.logo-lockup{display:inline-flex!important;align-items:center;gap:12px;text-decoration:none!important;white-space:nowrap;letter-spacing:normal!important;line-height:1;color:inherit}
.logo-lockup .logo-symbol{display:block;flex:0 0 auto;width:52px;height:56px;color:currentColor}
.logo-lockup .logo-symbol path{stroke:currentColor}
.logo-lockup .logo-divider{display:block;width:1px;height:42px;background:currentColor;opacity:.52;flex:0 0 1px}
.logo-lockup .logo-wordmark{display:inline-block;font-family:"Bodoni Moda",Georgia,serif!important;font-size:27px!important;font-weight:400!important;line-height:1.15;letter-spacing:.27em!important;color:inherit!important;white-space:nowrap;margin-right:-.27em}
.footer-brand.logo-lockup{gap:14px;margin-bottom:13px}
.footer-brand.logo-lockup .logo-symbol{width:62px;height:66px}
.footer-brand.logo-lockup .logo-divider{height:49px}
.footer-brand.logo-lockup .logo-wordmark{font-size:30px!important}
.brand.logo-lockup .logo-symbol{width:45px;height:49px}
.brand.logo-lockup .logo-divider{height:37px}
.brand.logo-lockup .logo-wordmark{font-size:25px!important}
@media(max-width:850px){.logo-lockup{gap:9px}.logo-lockup .logo-symbol{width:42px;height:46px}.logo-lockup .logo-divider{height:34px}.logo-lockup .logo-wordmark{font-size:21px!important;letter-spacing:.22em!important;margin-right:-.22em}.footer-brand.logo-lockup .logo-symbol{width:54px;height:58px}.footer-brand.logo-lockup .logo-wordmark{font-size:26px!important}}
@media(max-width:420px){.logo-lockup{gap:7px}.logo-lockup .logo-symbol{width:36px;height:40px}.logo-lockup .logo-divider{height:30px}.logo-lockup .logo-wordmark{font-size:18px!important;letter-spacing:.18em!important;margin-right:-.18em}}
</style>
</head>
<body>
<header><a class="logo logo-lockup" href="index.html"><svg class="logo-symbol" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><path d="M25 15.5H76"/><path d="M50.5 15.5V76.5C50.5 82 54.5 85 61 85H83"/><path d="M50.5 76.5C43 88 29 93 17 83"/><path d="M20 83.5H33" stroke-width="1.35"/></g></svg><span class="logo-divider" aria-hidden="true"></span><span class="logo-wordmark">LUNÉRA</span></a><a href="index.html">BACK TO STORE</a></header>
<main>
<h1>Your Account</h1>
<p class="muted">Your personal space for LUNÉRA orders and updates.</p>
<section class="account">
<div><strong id="customerName">Welcome</strong><div id="customerEmail" class="muted"></div></div>
<button id="signout" type="button">SIGN OUT</button>
</section>
<h2 style="font:400 28px 'Bodoni Moda',serif">Your Orders</h2>
<p class="status-note">Order status updates appear here automatically.</p>
<div id="orders" aria-live="polite"><p>Loading your orders…</p></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="lunera-cloud.js"></script>
<script>
(()=>{
 const box=document.getElementById("orders");
 const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
 const dateText=value=>{if(!value)return "";const d=new Date(value);return Number.isNaN(d.getTime())?String(value):d.toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"});};
 function renderOrders(orders){
  if(!orders.length){box.innerHTML="<p>You have not placed an order yet. Your orders will appear here.</p>";return;}
  box.innerHTML=orders.map(o=>{
   const status=String(o.status||"Received");
   const payment=String(o.paymentStatus||"Pending");
   return `<article class="order">
    <div class="top"><h3>Order ${esc(o.id||o.idKey)}</h3><span class="status status-pill">${esc(status)} · ${esc(payment)}</span></div>
    <div class="items">${(o.items||[]).map(i=>`${esc(i.name||"Item")} × ${Math.max(1,Number(i.quantity)||1)}${i.size?" · Size "+esc(i.size):""}`).join("<br>")}<br><strong>Total: ₹${Number(o.total||0).toLocaleString("en-IN")}</strong><br><span class="order-date">${esc(dateText(o.date))}</span></div>
   </article>`;
  }).join("");
 }
 async function init(){
  try{
   await LuneraCloud.ready;
   const u=await LuneraCloud.currentUser();
   if(!u){location.href="customer-auth.html?return=profile.html";return;}
   document.getElementById("customerName").textContent=u.displayName||"Welcome";
   document.getElementById("customerEmail").textContent=u.email||"";
   await LuneraCloud.watchMyOrders(renderOrders,e=>{box.innerHTML="<p>"+esc(e.message||"Unable to receive order updates.")+"</p>";});
  }catch(e){box.innerHTML="<p>"+esc(e.message||"Unable to load orders.")+"</p>";}
 }
 document.getElementById("signout").addEventListener("click",()=>LuneraCloud.signOutCustomer());
 init();
})();
</script>
</body>
</html>
