<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#f7f4ef;
  color:#151212;

}

a{
  color:inherit;

}

button{

/* HEADER */

header{
  height:86px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(21,18,18,.12);
  background:#f7f4ef;
  position:sticky;
  top:0;
  z-index:50;
}

.logo{

  font-size:31px;
  letter-spacing:5px;
  font-weight:500;
}

nav{
  display:flex;
  align-items:center;
  gap:32px;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
}

nav a{
  transition:.25s ease;
}

nav a:hover{
  opacity:.55;
}

.bag{
  display:flex;
  align-items:center;
  gap:8px;
}

.bag-count{
  min-width:20px;
  height:20px;
  border-radius:50%;
  background:#17352b;
  color:#fff;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  letter-spacing:0;
}

/* PAGE */

.page{
  max-width:1200px;
  margin:auto;

}

.page-heading{

}

.eyebrow{

}

/* EMPTY */

.empty{
  text-align:center;
  padding:80px 20px;
  border-top:1px solid rgba(21,18,18,.12);
}

.empty h2{

  font-weight:400;
  font-size:42px;
  margin-bottom:15px;
}

.empty p{

  font-size:21px;
  color:#57514b;
  margin-bottom:30px;
}

.shop-btn{

  font-size:10px;
  letter-spacing:2px;

}

.shop-btn:hover{

/* CART */

.cart-layout{
  display:grid;
  grid-template-columns:minmax(0,1.5fr) minmax(300px,.7fr);
  gap:70px;
  align-items:start;
}

.cart-items{

}

.cart-item{

  border-bottom:1px solid rgba(21,18,18,.15);

  grid-template-columns:125px 1fr auto;
  gap:25px;
  align-items:center;
}

.cart-image{

  object-fit:contain;
  display:block;
  background:#ebe6de;
}

.item-category{
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#17352b;
  margin-bottom:8px;
}

.item-name{
  font-family:"Bodoni Moda",serif;
  font-size:25px;
  font-weight:400;
  margin-bottom:10px;
}

.item-meta{
  font-size:10px;
  letter-spacing:1px;
  color:#706a64;
  margin-bottom:15px;
}

.item-price{

.item-actions{

.quantity{

}

.quantity button{

  cursor:pointer;

.quantity button:hover{

.quantity span{

  text-align:center;

}

.remove{

  text-transform:uppercase;

.item-total{

  letter-spacing:1.5px;
  text-transform:uppercase;

}

.clear-btn{

  letter-spacing:1.5px;
  text-transform:uppercase;

}

.clear-btn:hover{

  color:#fff;

<script>

/* =========================
   BASIC HELPERS
========================= */

function parsePrice(value){
  const parsed=Number(String(value ?? "0").replace(/[^0-9.-]/g,""));
  return Number.isFinite(parsed) && parsed>=0 ? parsed : 0;
}
function formatPrice(value){return "₹" + parsePrice(value).toLocaleString("en-IN",{maximumFractionDigits:2});}

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   CART STORAGE
========================= */

function getCart(){

  try{

    const saved =
      localStorage.getItem("luneraCart");

    const cart =
      saved ? JSON.parse(saved) : [];

    return Array.isArray(cart)
      ? cart
      : [];

  }catch(error){

    console.warn("Could not read cart.");

    return [];

  }

}


function saveCart(cart){

  localStorage.setItem(
    "luneraCart",
    JSON.stringify(cart)
  );

}


/* =========================
   BAG COUNT
========================= */

function updateBagCount(){

  const cart=getCart();

  const count=cart.reduce(
    (total,item)=>{

      const quantity=
        Number(item.quantity || 1);

      return total + quantity;

    },
    0
  );

  const bagCount=
    document.getElementById("bagCount");

  if(bagCount){

    bagCount.textContent=count;

  }

}


/* =========================
   CATEGORIES
========================= */

function getCategories(){

  const defaults=[
    "Bras",
    "Panties",
    "Lingerie Sets",
    "Nightwear",
    "Essentials"
  ];

  try{

    const saved=
      localStorage.getItem("luneraCategories");

    if(saved){

      const categories=
        JSON.parse(saved);

      if(Array.isArray(categories)){

        return categories;

      }

    }

  }catch(error){

    console.warn(
      "Could not read categories."
    );

  }

  return defaults;

}


/* =========================
   FOOTER
========================= */

function renderFooter(){

  const footer=
    document.getElementById(
      "footerCategories"
    );

  if(!footer){
    return;
  }

  const categories=
    getCategories();

  footer.innerHTML=
    categories
      .map(category=>`

        <a
          href="product.html?category=${encodeURIComponent(category)}"
        >
          ${escapeHTML(category)}
        </a>

      `)
      .join("");


  // The Firebase auth listener in lunera-cloud.js controls the admin link.

}


/* =========================
   CHANGE QUANTITY
========================= */

function changeQuantity(index,change){

  const cart=getCart();

  if(!cart[index]){
    return;
  }

  let quantity=
    Number(cart[index].quantity || 1);

  quantity+=change;


  if(quantity<1){
    quantity=1;
  }


  if(quantity>20){
    quantity=20;
  }


  cart[index].quantity=
    quantity;

  saveCart(cart);

  renderCart();

}


/* =========================
   REMOVE ITEM
========================= */

function removeItem(index){

  const cart=getCart();

  if(!cart[index]){
    return;
  }

  cart.splice(index,1);

  saveCart(cart);

  renderCart();

}


/* =========================
   CLEAR BAG
========================= */

function clearBag(){

  const cart=getCart();

  if(!cart.length){
    return;
  }


  const confirmed=
    confirm(
      "Are you sure you want to clear your bag?"
    );


  if(!confirmed){
    return;
  }


  localStorage.removeItem(
    "luneraCart"
  );

  renderCart();

}


/* =========================
   IMAGE FALLBACK
========================= */

function imageFallback(image){

  image.onerror=null;

  image.src=
    "https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=600&q=85";

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

  const cart=getCart();

  updateBagCount();

  const container=
    document.getElementById(
      "cartContent"
    );


  if(!container){
    return;
  }


  /* EMPTY BAG */

  if(!cart.length){

    container.innerHTML=`

      <div class="empty">

        <h2>
          Your bag is empty.
        </h2>

        <p>
          Discover the LUNÉRA collection
          and find your next essential.
        </p>

        <a
          href="product.html"
          class="shop-btn"
        >
          Explore Collection
        </a>

      </div>

    `;

    return;

  }


  /* SUBTOTAL */

  let subtotal=0;


  cart.forEach(item=>{

    const price=
      parsePrice(item.price);

    const quantity=
      Number(item.quantity || 1);

    subtotal +=
      price * quantity;

  });


  /*
    Current LUNÉRA shipping setup:
    complimentary shipping.
  */

  const shipping=0;

  const total=
    subtotal + shipping;


  container.innerHTML=`

    <div class="cart-layout">


      <div>

        <div class="cart-items">


          ${cart.map((item,index)=>{

            const price=
              parsePrice(item.price);

            const quantity=
              Number(item.quantity || 1);

            const itemTotal=
              price * quantity;


            return `

              <article
                class="cart-item"
              >


                <img

                  class="cart-image"

                  src="${escapeHTML(
                    item.image || ""
                  )}"

                  alt="${escapeHTML(
                    item.name || "LUNÉRA product"
                  )}"

                  onerror="imageFallback(this)"

                >


                <div>


                  <div class="item-category">

                    ${escapeHTML(
                      item.category ||
                      "LUNÉRA"
                    )}

                  </div>


                  <div class="item-name">

                    ${escapeHTML(
                      item.name ||
                      "LUNÉRA Product"
                    )}

                  </div>


                  ${item.size?`<div class="item-meta">Size: ${escapeHTML(item.size)}</div>`:""}
                  ${item.color?`<div class="item-meta">Colour: ${escapeHTML(item.color)}</div>`:""}


                  <div class="item-price">

                    ${formatPrice(price)}

                  </div>


                  <div class="item-actions">


                    <div class="quantity">


                      <button
                        type="button"
                        aria-label="Decrease quantity"
                        onclick="changeQuantity(${index},-1)"
                      >
                        −
                      </button>


                      <span>

                        ${quantity}

                      </span>


                      <button
                        type="button"
                        aria-label="Increase quantity"
                        onclick="changeQuantity(${index},1)"
                      >
                        +
                      </button>


                    </div>


                    <button
                      type="button"
                      class="remove"
                      onclick="removeItem(${index})"
                    >
                      Remove
                    </button>


                  </div>


                </div>


                <div class="item-total">

                  ${formatPrice(itemTotal)}

                </div>


              </article>

            `;

          }).join("")}


        </div>


        <button
          type="button"
          class="clear-btn"
          onclick="clearBag()"
        >
          Clear Bag
        </button>


      </div>


      <aside class="summary">


        <div class="summary-title">

          Order Summary

        </div>


        <div class="summary-row">

          <span>
            Subtotal
          </span>

          <span>
            ${formatPrice(subtotal)}
          </span>

        </div>


        <div class="summary-row">

          <span>
            Shipping
          </span>

          <span>
            Complimentary
          </span>

        </div>


        <div class="summary-row total">

          <span>
            Total
          </span>

          <span class="summary-total">

            ${formatPrice(total)}

          </span>

        </div>


        <div class="shipping-note">

          Complimentary shipping is currently
          available on LUNÉRA orders.
          Final shipping details are shown
          during checkout.

        </div>


        <button
          type="button"
          class="checkout-btn"
          onclick="goToCheckout()"
        >
          Proceed to Checkout
        </button>


        <a
          href="product.html"
          class="continue"
        >
          Continue Shopping
        </a>


      </aside>


    </div>

  `;

}


/* =========================
   CHECKOUT
========================= */

function goToCheckout(){

  const cart=getCart();

  if(!cart.length){
    return;
  }

  window.location.href=
    "checkout.html";

}


/* =========================
   STORAGE SYNC
========================= */

window.addEventListener(
  "storage",
  function(){

    renderCart();

    renderFooter();

  }
);


/* =========================
   INITIAL LOAD
========================= */

renderCart();

renderFooter();

updateBagCount();
window.addEventListener("lunera:catalogue-updated",function(){renderCart();renderFooter();updateBagCount();});


</script>
